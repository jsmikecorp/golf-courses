<title>전국 골프장 현황 조회</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--tx:#f5f5f7;--sub:#8e8e93;--ac:#0a84ff;--ln:#38383a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}main{max-width:820px;margin:0 auto;padding:16px 16px 60px}

input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;width:100%;outline:none}

#lock{max-width:360px;margin:18vh auto 0;text-align:center}#lock input{margin:16px 0 10px;text-align:center}#lock button{width:100%}#msg{color:#ff453a;font-size:13px;min-height:18px;margin-top:8px}
.bar{position:sticky;top:0;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 0;z-index:5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.grid select{padding:9px 10px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card2);color:var(--tx);font-size:13px;font-weight:500}.chip.on{background:var(--tx);color:#000}
.cnt{color:var(--sub);font-size:13px;margin:10px 2px 6px;display:flex;justify-content:space-between}.cnt a{color:var(--ac);cursor:pointer}
.card{background:var(--card);border-radius:14px;padding:13px 15px;margin-bottom:8px;cursor:pointer}
.t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.n{font-weight:600;font-size:16px}.h{color:var(--sub);font-size:13px;flex:none}

.tag.p{color:#30d158}.tag.r{color:#ff9f0a}

mark{background:#0a84ff55;color:inherit;border-radius:3px}footer{color:var(--sub);font-size:12px;text-align:center;margin-top:20px}

<script>/* 순수 JS PBKDF2-HMAC-SHA256 + AES-256-GCM 복호화 (crypto.subtle 이 없는 환경용 대체 구현) */

  var IV = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var W = new Int32Array(64);
  // st: 이전 상태(8 words), m: 16 words, out: 결과(8 words)
  function compress(st, m, out){
    var i, t1, t2, a=st[0]|0,b=st[1]|0,c=st[2]|0,d=st[3]|0,e=st[4]|0,f=st[5]|0,g=st[6]|0,h=st[7]|0;
    for (i=0;i<16;i++) W[i]=m[i]|0;
    for (i=16;i<64;i++){
      var x=W[i-15], y=W[i-2];
      W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3)) + W[i-7] + ((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10)) + W[i-16])|0;

      t1=(h + ((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7)) + ((e&f)^(~e&g)) + K[i] + W[i])|0;
      t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10)) + ((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    out[0]=(st[0]+a)|0; out[1]=(st[1]+b)|0; out[2]=(st[2]+c)|0; out[3]=(st[3]+d)|0;
    out[4]=(st[4]+e)|0; out[5]=(st[5]+f)|0; out[6]=(st[6]+g)|0; out[7]=(st[7]+h)|0;
  }
  // 상태 st 에서 이어서 bytes 를 해시 (prefixLen: 이미 처리된 바이트 수)
  function hashFrom(st, bytes, prefixLen){
    var len=bytes.length, total=len+prefixLen, nb=((len+9+63)>>6), buf=new Uint8Array(nb*64);
    buf.set(bytes); buf[len]=0x80;
    var bits=total*8, end=nb*64;
    buf[end-4]=(bits>>>24)&255; buf[end-3]=(bits>>>16)&255; buf[end-2]=(bits>>>8)&255; buf[end-1]=bits&255;
    buf[end-5]=Math.floor(bits/4294967296)&255;
    var s=Int32Array.from(st), m=new Int32Array(16);
    for (var bl=0; bl<nb; bl++){
      for (var j=0;j<16;j++){ var o=bl*64+j*4; m[j]=(buf[o]<<24)|(buf[o+1]<<16)|(buf[o+2]<<8)|buf[o+3]; }
      compress(s, m, s);
    }
    return s;
  }
  function wordsToBytes(w){ var b=new Uint8Array(w.length*4); for (var i=0;i<w.length;i++){ b[i*4]=w[i]>>>24; b[i*4+1]=w[i]>>>16; b[i*4+2]=w[i]>>>8; b[i*4+3]=w[i]; } return b; }
  function sha256(bytes){ return wordsToBytes(hashFrom(IV, bytes, 0)); }

  function cat(a, b){ var o=new Uint8Array(a.length+b.length); o.set(a); o.set(b, a.length); return o; }
  // HMAC-SHA256 (RFC 2104)
  function hmac(key, msg){
    if (key.length > 64) key = sha256(key);
    var k=new Uint8Array(64); k.set(key);
    var ip=new Uint8Array(64), op=new Uint8Array(64);
    for (var i=0;i<64;i++){ ip[i]=k[i]^0x36; op[i]=k[i]^0x5c; }
    return sha256(cat(op, sha256(cat(ip, msg))));
  }
  // HKDF-SHA256 (RFC 5869), 출력 32바이트
  function hkdf32(ikm, salt, info){
    var prk = hmac(salt && salt.length ? salt : new Uint8Array(32), ikm);
    return hmac(prk, cat(info, new Uint8Array([1])));
  }
  // PBKDF2-HMAC-SHA256, 출력 32바이트(1블록). onProgress(0..1) 선택.
  function pbkdf2(pwBytes, salt, iter, onProgress){
    if (pwBytes.length > 64) pwBytes = sha256(pwBytes);
    var k=new Uint8Array(64); k.set(pwBytes);
    var ip=new Uint8Array(64), op=new Uint8Array(64);
    for (var i=0;i<64;i++){ ip[i]=k[i]^0x36; op[i]=k[i]^0x5c; }
    var m=new Int32Array(16), istate=new Int32Array(8), ostate=new Int32Array(8);
    for (i=0;i<16;i++) m[i]=(ip[i*4]<<24)|(ip[i*4+1]<<16)|(ip[i*4+2]<<8)|ip[i*4+3];
    compress(IV, m, istate);
    for (i=0;i<16;i++) m[i]=(op[i*4]<<24)|(op[i*4+1]<<16)|(op[i*4+2]<<8)|op[i*4+3];
    compress(IV, m, ostate);
    var msg=new Uint8Array(salt.length+4); msg.set(salt); msg[salt.length+3]=1;
    var inner=hashFrom(istate, msg, 64);
    var u=hashFrom(ostate, wordsToBytes(inner), 64);
    var acc=Int32Array.from(u);
    // 이후 반복: 32바이트 입력 → 고정 패딩 1블록
    var blk=new Int32Array(16); blk[8]=0x80000000|0; blk[15]=768;
    var tmp=new Int32Array(8);
    var step = Math.max(1, Math.floor(iter/50));
    return new Promise(function(resolve){
      var n=1;
      function run(){
        var stop=Math.min(iter, n+step);
        for (; n<stop; n++){
          for (var j=0;j<8;j++) blk[j]=u[j];
          compress(istate, blk, tmp);
          for (j=0;j<8;j++) blk[j]=tmp[j];
          compress(ostate, blk, u);
          for (j=0;j<8;j++) acc[j]^=u[j];

        if (onProgress) onProgress(n/iter);
        if (n<iter) setTimeout(run, 0); else resolve(wordsToBytes(acc));
      }

  var SBOX=new Uint8Array(256), T0=new Uint32Array(256), T1=new Uint32Array(256), T2=new Uint32Array(256), T3=new Uint32Array(256);

    var p=1, q=1, i;
    do {
      p = p ^ ((p<<1)&255) ^ (p & 0x80 ? 0x1b : 0);
      q ^= q<<1; q ^= q<<2; q ^= q<<4; q &= 255; if (q & 0x80) q ^= 0x09;

      SBOX[p] = (x ^ 0x63) & 255;

    for (i=0;i<256;i++){
      var s=SBOX[i], s2=((s<<1)^(s&0x80?0x1b:0))&255, s3=s2^s;

      t3=T0[s3>>>24]^T1[(s0>>>16)&255]^T2[(s1>>>8)&255]^T3[s2&255]^w[k+3];
      s0=t0; s1=t1; s2=t2; s3=t3; k+=4;
    }
    out[0]=(((SBOX[s0>>>24]<<24)|(SBOX[(s1>>>16)&255]<<16)|(SBOX[(s2>>>8)&255]<<8)|SBOX[s3&255])^w[k])>>>0;
    out[1]=(((SBOX[s1>>>24]<<24)|(SBOX[(s2>>>16)&255]<<16)|(SBOX[(s3>>>8)&255]<<8)|SBOX[s0&255])^w[k+1])>>>0;
    out[2]=(((SBOX[s2>>>24]<<24)|(SBOX[(s3>>>16)&255]<<16)|(SBOX[(s0>>>8)&255]<<8)|SBOX[s1&255])^w[k+2])>>>0;
    out[3]=(((SBOX[s3>>>24]<<24)|(SBOX[(s0>>>16)&255]<<16)|(SBOX[(s1>>>8)&255]<<8)|SBOX[s2&255])^w[k+3])>>>0;

    for (i=0;i<clen;i+=16){

    }
    return out;
  }
  return { pbkdf2: pbkdf2, gcmDecrypt: gcmDecrypt, sha256: sha256, hmac: hmac, hkdf32: hkdf32 };
})();
